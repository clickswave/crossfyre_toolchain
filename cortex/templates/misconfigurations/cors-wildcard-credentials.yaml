id: cors-reflected-origin-with-credentials
info:
  name: CORS reflects arbitrary origin with credentials
  severity: medium
  description: The server reflects an attacker-supplied Origin into Access-Control-Allow-Origin while also allowing credentials, so a malicious site can read authenticated responses cross-origin.
  tags: misconfig,cors
  metadata:
    category: misconfigurations
    cwe: CWE-942
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    headers:
      Origin: "https://evil.example.com"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Origin: https://evil.example.com"
      - type: word
        part: header
        words:
          - "Access-Control-Allow-Credentials: true"
