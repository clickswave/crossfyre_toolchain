id: langflow-public-build-unauth-rce
info:
  name: Langflow public build/playground endpoint exposed (unauthenticated RCE)
  severity: critical
  description: The unauthenticated public build endpoint (/api/v1/build_public_tmp/{id}/flow) is present. Langflow instantiates attacker-supplied flow component code server-side when the build events stream is consumed, giving unauthenticated remote code execution. Confirmed non-destructively by the endpoint processing an unauthenticated request (a non-404/401 response to an empty body). Uses a vhost Host header for name-based routing.
http:
  - method: POST
    path:
      - "{{BaseURL}}/api/v1/build_public_tmp/00000000-0000-0000-0000-000000000000/flow"
    headers:
      Host: flow.fireflow.htb
      Content-Type: application/json
    body: "{}"
    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - "status_code == 400 || status_code == 422 || status_code == 200 || status_code == 500"
      - type: dsl
        dsl:
          - "status_code != 404 && status_code != 401 && status_code != 403"
