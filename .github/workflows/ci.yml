name: CI

# What this guards, in priority order:
#
#   1. The OPEN checkout builds. This repo is open-core: `adaptive-private/`,
#      `core/src/egress/private.rs` and `.cargo/config.toml` exist in first-party
#      working copies and are git-ignored. Locally, `.cargo/config.toml` swaps the
#      committed `adaptive` crate for the private drop-in and `core/build.rs`
#      compiles the private egress module, so a first-party build is NOT the same
#      build the public gets. CI runs on a clean checkout, which is the only
#      honest test that the open baseline still compiles on its own.
#
#   2. Those private paths never get committed. A stray `git add -A` would leak
#      the tuned pacing crate and the isolated-egress implementation. The
#      open-core job fails the build if any of them appear.
#
# rustfmt and clippy are both REQUIRED: the workspace is formatted and at zero
# clippy warnings. Only the dependency-advisory job stays advisory, because its
# findings are transitive pins with no upstream fix available yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref: this workspace is not cheap to build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer debug symbols; CI never runs a debugger and this is a big workspace.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Deliberately NOT `-D warnings` here. The build job answers one question,
  # "does this compile and pass its tests". Lint lives in the clippy job, which
  # does use `-D warnings` now that the tree is clean.

permissions:
  contents: read

jobs:
  open-core:
    name: open-core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Private drop-ins must not be committed
        run: |
          set -eu
          leaked=0
          for p in adaptive-private .cargo/config.toml core/src/egress/private.rs; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "::error file=$p::$p is tracked in git. This is a private \
          drop-in and must never ship in the open repo."
              leaked=1
            fi
          done
          # Also catch the whole directory being added under any path.
          if git ls-files | grep -qE '(^|/)adaptive-private/|(^|/)egress/private\.rs$'; then
            echo "::error::a private drop-in path is tracked in git"
            leaked=1
          fi
          if [ "$leaked" -ne 0 ]; then
            echo "::error::open-core boundary breached, refusing to build"
            exit 1
          fi
          echo "open-core boundary intact"

      - name: The open baseline is what actually gets compiled
        run: |
          set -eu
          test ! -e .cargo/config.toml || { echo "::error::.cargo/config.toml present in a clean checkout"; exit 1; }
          test -f adaptive/src/lib.rs        || { echo "::error::open adaptive crate missing"; exit 1; }
          test -f core/src/egress/baseline.rs || { echo "::error::open egress baseline missing"; exit 1; }
          test ! -e core/src/egress/private.rs
          echo "clean checkout resolves to the open baseline"

  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned rather than `stable`. 1.88.0 is the real floor, set by the
        # dependency graph rather than by our own code: cookie_store, darling,
        # home and the hickory-* crates all declare rust-version 1.88. Edition
        # 2024 alone would only need 1.85, and pinning there fails with a wall of
        # "not supported by the following packages". A floating `stable` would
        # also make a green run today say nothing about tomorrow.
        #
        # Raising this is fine; lowering it needs the dependency floors checked:
        #   cargo +<older> check --workspace --locked
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check (all targets, including tests and benches)
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Required. This is green as of the workspace-wide rustfmt pass, and it also
    # guards the fix that made `cargo fmt` work on a public checkout at all: the
    # egress module used to declare two cfg-gated `mod imp;` arms, and rustfmt
    # resolves module paths without evaluating cfg, so it hard-errored on the
    # private path that only exists in first-party clones.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.88.0
      - name: rustfmt
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # Required as of the clippy cleanup: the workspace is at zero warnings, and
    # `-D warnings` keeps it there. Every remaining `#[allow(...)]` in the tree
    # carries a comment saying why, so a future warning means new code, not
    # inherited debt.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with lint components
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: dependency advisories (advisory)
    runs-on: ubuntu-latest
    # The engines parse untrusted input from scan targets, so a DoS-class
    # advisory in a DNS or QUIC parser matters more here than the CVSS suggests.
    # Advisory-only because several current findings are transitive pins with no
    # upstream release yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Two advisories have no upstream fix, so they are ignored by ID rather
      # than left to turn the whole job red permanently:
      #   RUSTSEC-2023-0071  rsa timing sidechannel (Marvin). Open since 2023,
      #     needs the modular exponentiation reworked upstream. rsa reaches us
      #     via cortex and oast, which verify certificates presented by scan
      #     targets rather than decrypt with our own keys, so the operation the
      #     attack times is not one we perform.
      #   RUSTSEC-2025-0134  rustls-pemfile unmaintained. A notice, not a
      #     vulnerability, on a crate pulled in by axum-server and
      #     rustls-native-certs.
      # Everything else must stay visible and get fixed.
      - name: Audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134
