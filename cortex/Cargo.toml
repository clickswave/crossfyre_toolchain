[package]
name = "cortex"
version = "0.0.6"
edition = "2024"
homepage = "https://clickswave.org"
repository = "https://github.com/clickswave/crossfyre_toolchain"
keywords = ["vulnerability", "security", "scanner", "dast"]
authors = ["Clickswave <team@clickswave.org>"]

[dependencies]
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4.5.42", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_yaml = "0.9"
reqwest = { version = "0.12.22", features = ["cookies", "gzip", "json"] }
# OAST client-side crypto: keygen, RSA-OAEP unwrap, AES-256-GCM open.
rsa = "0.9"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
regex = "1"
uuid = { version = "1.18.0", features = ["v4"] }
