id: tech-apache-httpd
info:
  name: Apache httpd detected
  severity: info
  description: The Server header identifies the Apache HTTP Server, fixing the web server (and, when a version is present, its known-CVE exposure) for follow-up checks.
  tags: tech,apache,webserver
  metadata:
    category: technologies
    vendor: apache
    product: http_server
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "Server: Apache"
